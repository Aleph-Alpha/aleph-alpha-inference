[build-system]
requires = ["setuptools>=84,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "aleph-alpha-inference"
version = "1.0.0"
description = "vLLM plugin for Aleph Alpha models"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Aleph Alpha" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# vLLM's plugin and parser APIs change between minor versions, so each release
# supports exactly one vLLM minor version.
dependencies = [
    "vllm>=0.29.0,<0.30.0",
    "torch>=2.9.0",
    "transformers>=5.5.3",
]

[project.entry-points."vllm.general_plugins"]
aleph_alpha_inference = "aleph_alpha_inference:register"

[project.urls]
Repository = "https://github.com/Aleph-Alpha/aleph-alpha-inference"
Changelog = "https://github.com/Aleph-Alpha/aleph-alpha-inference/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["aleph_alpha_inference"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs CUDA and a vLLM-capable GPU",
]
